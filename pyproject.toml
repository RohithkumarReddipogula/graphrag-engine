[project]
name = "graphrag-engine"
version = "0.1.0"
description = "GraphRAG vs hybrid retrieval, benchmarked on 2WikiMultiHopQA"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Rohith Kumar Reddipogula" }]
dependencies = [
    "fastapi>=0.142",
    "httpx>=0.28",
    "neo4j>=6.3",
    "numpy>=2.5",
    "pandas>=3.0",
    "pyarrow>=25.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14",
    "sentence-transformers>=6.1",
    "tiktoken>=0.14",
    "uvicorn>=0.37",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]
m7 = ["neo4j-graphrag==1.22.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/graphrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
